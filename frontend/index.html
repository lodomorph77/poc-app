<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth PoC</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }

      /* ── Auth pages ── */
      .container { max-width: 420px; margin: 80px auto; background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
      h1 { margin-top: 0; font-size: 1.4rem; }
      label { display: block; margin-bottom: 4px; font-size: .875rem; font-weight: 600; }
      input[type=text], input[type=email], input[type=password], textarea {
        width: 100%; padding: 9px 11px; border: 1px solid #d1d5db; border-radius: 6px;
        font-size: 1rem; margin-bottom: 14px; font-family: inherit;
      }
      input:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }
      textarea { resize: vertical; min-height: 80px; }
      .btn { padding: 9px 16px; border: none; border-radius: 6px; font-size: .9rem; cursor: pointer; font-family: inherit; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-primary:hover { background: #1d4ed8; }
      .btn-danger  { background: #ef4444; color: #fff; }
      .btn-danger:hover { background: #dc2626; }
      .btn-ghost   { background: transparent; color: #6b7280; border: 1px solid #d1d5db; }
      .btn-ghost:hover { background: #f9fafb; }
      .btn-full    { width: 100%; }
      .link { text-align: center; margin-top: 12px; font-size: .875rem; }
      .link a { color: #2563eb; text-decoration: none; }
      .error   { color: #dc2626; font-size: .875rem; margin-bottom: 10px; padding: 8px 12px; background: #fef2f2; border-radius: 6px; }
      .success { color: #15803d; font-size: .875rem; margin-bottom: 10px; padding: 8px 12px; background: #f0fdf4; border-radius: 6px; }

      /* ── Top nav ── */
      .topnav {
        display: flex; align-items: center; justify-content: space-between;
        background: #1e293b; color: #f1f5f9; padding: 0 24px; height: 52px;
        position: sticky; top: 0; z-index: 100;
      }
      .topnav-links { display: flex; gap: 4px; }
      .topnav-links a {
        color: #94a3b8; text-decoration: none; padding: 6px 12px; border-radius: 6px;
        font-size: .9rem; transition: background .15s;
      }
      .topnav-links a:hover { background: #334155; color: #f1f5f9; }
      .topnav-links a.active { background: #2563eb; color: #fff; }
      .topnav-user { display: flex; align-items: center; gap: 12px; font-size: .875rem; color: #94a3b8; }
      .topnav-user button { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 4px 10px; border-radius: 5px; cursor: pointer; font-size: .8rem; }
      .topnav-user button:hover { background: #334155; color: #f1f5f9; }

      /* ── Page layout ── */
      .page { max-width: 760px; margin: 32px auto; padding: 0 16px; }
      .page h1 { font-size: 1.5rem; margin-bottom: 20px; }
      .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 16px; }

      /* ── Dashboard stats ── */
      .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
      .stat-card { background: #fff; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
      .stat-card .stat-value { font-size: 2.2rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
      .stat-card .stat-label { font-size: .8rem; color: #6b7280; text-transform: uppercase; letter-spacing: .05em; }
      .stat-card.blue   .stat-value { color: #2563eb; }
      .stat-card.green  .stat-value { color: #16a34a; }
      .stat-card.orange .stat-value { color: #ea580c; }

      /* ── Progress bar ── */
      .progress-bar { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 6px 0 12px; }
      .progress-fill { height: 100%; background: #16a34a; border-radius: 999px; transition: width .4s; }

      /* ── Inline add form ── */
      .add-form { display: flex; gap: 8px; margin-bottom: 16px; }
      .add-form input { flex: 1; margin-bottom: 0; }

      /* ── Filter tabs ── */
      .filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
      .filter-tabs button { padding: 5px 14px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: .85rem; color: #374151; }
      .filter-tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
      .filter-tabs button:hover:not(.active) { background: #f3f4f6; }

      /* ── Todo items ── */
      .item-list { display: flex; flex-direction: column; gap: 8px; }
      .todo-item { display: flex; align-items: flex-start; gap: 12px; background: #fff; border-radius: 8px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .todo-item.done .todo-title { text-decoration: line-through; color: #9ca3af; }
      .todo-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #2563eb; flex-shrink: 0; margin-top: 2px; }
      .todo-body { flex: 1; }
      .todo-title { font-size: .95rem; font-weight: 500; }
      .todo-desc  { font-size: .82rem; color: #6b7280; margin-top: 2px; }
      .todo-actions { display: flex; gap: 6px; align-items: center; }

      /* ── Note items ── */
      .note-item { display: flex; justify-content: space-between; align-items: flex-start; background: #fff; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .note-body { flex: 1; }
      .note-title   { font-size: .95rem; font-weight: 600; margin-bottom: 4px; }
      .note-content { font-size: .85rem; color: #4b5563; white-space: pre-wrap; }
      .note-date    { font-size: .75rem; color: #9ca3af; margin-top: 6px; }

      /* ── Expand form ── */
      .expand-form { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 14px; }
      .form-row { display: flex; gap: 8px; margin-bottom: 0; }
      .form-row input { flex: 1; margin-bottom: 0; }

      /* ── Empty state ── */
      .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: .95rem; }

      /* ── Recent list ── */
      .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: .9rem; }
      .recent-item:last-child { border-bottom: none; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 600; }
      .badge-done   { background: #dcfce7; color: #15803d; }
      .badge-active { background: #dbeafe; color: #1d4ed8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
