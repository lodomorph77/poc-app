services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # image name used when building locally and tagging for GHCR push
    image: ghcr.io/${IMAGE_OWNER:-local}/poc-app-backend:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "3001:3001"
    networks:
      - poc-net
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ghcr.io/${IMAGE_OWNER:-local}/poc-app-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - poc-net

networks:
  poc-net:
